spring.application.name=claims
server.port=8083

# =========================
# H2 Database
# =========================
spring.datasource.h2.jdbc-url=jdbc:h2:mem:claimsdb
spring.datasource.h2.driver-class-name=org.h2.Driver
spring.datasource.h2.username=claims_user
spring.datasource.h2.password=claims_password
spring.h2.console.enabled=true
spring.jpa.h2.hibernate.ddl-auto=update
spring.jpa.h2.show-sql=true
spring.jpa.h2.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

